<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Culinary Strategy Sim — Flat Modular</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <div class="wrap topbar">
      <div>
        <div class="brand">Culinary Strategy Sim <span class="muted">• Flat modular</span></div>
        <div class="muted small" id="subhead">Pick a country and run a 12-week season.</div>
      </div>
      <div class="row">
        <span class="muted small">Build</span>
        <input id="buildId" class="input" value="v0.1.0" />
        <button id="btnNew">New</button>
        <button id="btnSave">Save</button>
        <button id="btnExport">Export Telemetry</button>
        <button id="btnReset" class="ghost">Reset Local</button>
      </div>
    </div>
  </header>

  <main class="grid">
    <section class="card">
      <div class="row between">
        <div>
          <h1 id="title">Not started</h1>
          <div id="subtitle" class="muted small">Choose a country and press Start.</div>
        </div>
        <div class="row">
          <select id="countrySelect" class="input"></select>
          <button id="btnStart" class="accent">Start</button>
        </div>
      </div>

      <div class="hr"></div>

      <div id="kpis" class="kpis"></div>

      <div class="hr"></div>

      <div id="storyBlock"></div>
      <div class="hr"></div>
      <div id="actionBlock"></div>
      <div class="hr"></div>
      <div id="advanceBlock"></div>
    </section>

    <aside class="card">
      <div class="row between">
        <h2>Telemetry</h2>
        <div class="muted small">Export JSON for your build log</div>
      </div>
      <div class="hr"></div>
      <div id="log" class="log"></div>
    </aside>
  </main>

  <script type="module" src="./ui.js"></script>
</body>
</html>
